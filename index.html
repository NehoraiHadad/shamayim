<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131C3F" />
    <meta name="description" content="שמיים — מזג האוויר המדויק למקום שלך, בעברית ברורה" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>שמיים</title>
    <style>
      html, body { margin: 0; background: var(--boot-bg, #070B1E); }
      .boot {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: #EEF1FF;
        background: var(--boot-bg, #070B1E);
        font: 1rem system-ui;
        text-align: center;
      }
    </style>
    <noscript><style>#root > .boot { display: none; }</style></noscript>
    <script>
      // Paint the last sky colour before the app loads, so a daytime start does not flash navy.
      try {
        var bg = localStorage.getItem('shamayim:boot-bg')
        if (/^#[0-9a-f]{6}$/i.test(bg || '')) {
          document.documentElement.style.setProperty('--boot-bg', bg)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><p class="boot" role="status">טוען…</p></div>
    <noscript><p class="boot">שמיים צריך JavaScript כדי להציג את התחזית. אפשר להפעיל אותו בהגדרות הדפדפן.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
