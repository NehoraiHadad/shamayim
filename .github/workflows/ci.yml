name: CI

# Scratch branch, never merged: the real style's S0 (baseline and stability). One dispatch:
#   S0 again: gh workflow run ci.yml --ref claude/real-meas-base -f head=<sha of main>
#   A slice:  … -f full=false -f base=<sha of main> -f head=<sha of the slice>   (pair, stills, drawn identity base/head)
# `same` pairs put one commit under both names; `pair` puts `base` and `head`. Every log names the commit it ran.
on:
  workflow_dispatch:
    inputs:
      head: { description: 'The main we measure', required: false, default: '5fb0d856c11dea903ea26e0080582e94b8d0026d' }
      base: { description: 'The commit named beside it', required: false, default: 'b0181337609bf8cc71e2afefa975017395b96615' }
      concept: { description: 'The prototype laid over head', required: false, default: 'claude/real-style-13639d' }
      full: { description: 'S0: with the same-commit pairs and the prototype', required: false, type: boolean, default: true }

env:
  PLAYWRIGHT_BROWSERS_PATH: /home/runner/pw
  EXTRA: >-
    jerusalem@12:00@snow tel-aviv@17:00@broken tel-aviv@21:00 beit-shean@21:00 haifa@14:00@thunder haifa@12:00@overcast

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(inputs.full && '["same","pair"]' || '["pair"]') }}
        machine: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with: { path: tools }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, path: src }
      - uses: actions/setup-node@v5
        with: { node-version-file: tools/.nvmrc }
      - name: Trees a and b, with their own dependencies
        run: bash tools/s0/trees.sh "${{ matrix.pair == 'same' && inputs.head || inputs.base }}" "${{ inputs.head }}"
      - name: Four rounds, each order twice
        run: bash tools/s0/rounds.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'perf-${{ matrix.pair }}-${{ matrix.machine }}', path: logs/, retention-days: 30 }

  table:
    needs: perf
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc }
      - uses: actions/download-artifact@v5
        with: { path: perf, pattern: 'perf-*' }
      - run: node s0/table.mjs perf > s0-table.md && cat s0-table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: s0-table, path: s0-table.md, retention-days: 30 }

  layers:
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { path: tools }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, path: src }
      - uses: actions/setup-node@v5
        with: { node-version-file: tools/.nvmrc }
      - run: bash tools/s0/trees.sh "${{ inputs.head }}" "${{ inputs.head }}"
      - name: The prototype, laid over head
        env: { CONCEPT: '${{ inputs.concept }}' }
        run: git -C src archive "origin/$CONCEPT" docs/design/prototypes/real | tar -x -C b
      - run: node --experimental-strip-types tools/s0/layers.mjs "$PWD/b" $EXTRA > layers.md && cat layers.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: layers, path: layers.md, retention-days: 30 }

  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { path: tools }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, path: src }
      - uses: actions/setup-node@v5
        with: { node-version-file: tools/.nvmrc }
      - run: bash tools/s0/trees.sh "${{ inputs.head }}" "${{ inputs.head }}"
      - working-directory: b
        run: |
          set=$(node -e "import('./e2e/stillSet.mjs').then(m => console.log(m.STILL_SET.join(' ')))")
          node e2e/scene.stills.mjs ci-stills $set $EXTRA --dpr=2
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stills-before, path: b/ci-stills/, retention-days: 90 }

  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4, 5, 6, 7, 8] }
    steps:
      - uses: actions/checkout@v5
        with: { path: tools }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, path: src }
      - uses: actions/setup-node@v5
        with: { node-version-file: tools/.nvmrc }
      - run: bash tools/s0/trees.sh "${{ inputs.full && inputs.head || inputs.base }}" "${{ inputs.head }}"
      - working-directory: b
        run: |
          set=$(node -e "import('./e2e/stillSet.mjs').then(m => console.log(m.STILL_SET.join(' ')))")
          node e2e/styleIdentity.mjs ../a ci-identity $set $EXTRA --dpr=2 ${{ !inputs.full && '--styles=drawn' || '' }} --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'identity-${{ matrix.shard }}', path: b/ci-identity/, retention-days: 30 }
