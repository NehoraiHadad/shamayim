name: Build Israel landmarks

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: israel-landmarks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Download Israel and Palestine extract
        run: curl --fail --location --retry 3 --output israel-and-palestine.osm.pbf https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
      - name: Filter and export landmark features
        shell: bash
        run: |
          mapfile -t filters < <(npx tsx scripts/landmarks/printFilters.ts)
          osmium tags-filter israel-and-palestine.osm.pbf "${filters[@]}" -o landmarks.osm.pbf
          osmium export landmarks.osm.pbf -f geojsonseq --geometry-types=point,polygon -o landmarks.geojsonseq
      - name: Build static landmark cells
        run: npx tsx scripts/landmarks/build.ts landmarks.geojsonseq
      - name: Commit changed landmark data
        shell: bash
        run: |
          git add public/data/landmarks/il
          if git diff --cached --quiet; then
            echo "Landmark data is unchanged."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Data: Israel landmarks $(date -u +%F)"
          git push
