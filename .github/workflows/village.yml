name: Build village footprints

# Real building footprints for villages (Overture Maps, pinned in scripts/village/source.json). A push to a working branch
# only builds and measures. Tiles are committed only when asked for: by hand with a branch name, or by a push whose commit
# message says "[village tiles]". A message with "[village search]" also measures Open-Meteo's search points against the
# tiles. Nothing is deployed, and the default branch is never written.
#
# The pin, once a month (Overture deletes a release after 60 days; the committed tiles stay valid and are not touched):
# 1. Read the new release's changelog (docs.overturemaps.org/release-calendar) for the buildings theme's columns.
# 2. On a working branch, set "release" in scripts/village/source.json and "expected" to null, and push.
# 3. The run checks the schema (fetch.py) and stops with the measured counts: compare them with the ones before.
# 4. Put them in "expected" and push with "[village tiles]" in the message; review the data commit; merge.
on:
  workflow_dispatch:
    inputs:
      commit_to:
        description: Branch to commit the tiles to (empty = build and measure only; never the default branch)
        default: ''
  push:
    branches: ['claude/**']
    paths: ['scripts/village/**', 'src/data/village/**', '.github/workflows/village.yml']

permissions:
  contents: read

concurrency:
  group: village-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      branch: ${{ steps.ask.outputs.branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: ask
        name: Where the tiles are asked for
        env:
          INPUT: ${{ inputs.commit_to }}
          MESSAGE: ${{ github.event.head_commit.message }}
          PUSHED: ${{ github.event_name == 'push' && github.ref_name || '' }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          branch="$INPUT"
          if [ -n "$PUSHED" ] && [[ "$MESSAGE" == *"[village tiles]"* ]]; then branch="$PUSHED"; fi
          if [ -n "$branch" ]; then
            git check-ref-format "refs/heads/$branch"
            if [ "$branch" = "$DEFAULT" ]; then echo "The default branch is never written."; exit 1; fi
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Pinned Python packages
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes --only-binary :all: -r scripts/village/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - id: pin
        run: |
          mkdir -p "$RUNNER_TEMP/overture" "$RUNNER_TEMP/groups"
          echo "key=$(node -p "const s = require('./scripts/village/source.json'); ['village', s.release, ...s.box].join('-')")" >> "$GITHUB_OUTPUT"
      - id: data
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/overture
          key: ${{ steps.pin.outputs.key }}
      - name: Overture buildings
        if: steps.data.outputs.cache-hit != 'true'
        run: python -I scripts/village/fetch.py scripts/village/source.json "$RUNNER_TEMP/overture/building.parquet"
      - if: steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/overture
          key: ${{ steps.pin.outputs.key }}
      - name: Linked groups
        run: python -I scripts/village/groups.py scripts/village/source.json "$RUNNER_TEMP/overture/building.parquet" public/data/city/bounds.json "$RUNNER_TEMP/groups"
      - name: Tiles, measures and gates
        shell: bash
        run: npx tsx scripts/village/build.ts "$RUNNER_TEMP/groups" 2>&1 | tee "$RUNNER_TEMP/groups/build.txt"
      - name: Search points
        if: contains(github.event.head_commit.message, '[village search]')
        shell: bash
        run: npx tsx scripts/village/search.ts 2>&1 | tee "$RUNNER_TEMP/groups/search.txt"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: village-tiles
          path: |
            public/data/village
            src/data/village/tileList.json
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: village-report
          path: |
            ${{ runner.temp }}/groups/*.txt
            ${{ runner.temp }}/groups/facts.json
          retention-days: 14

  commit:
    needs: build
    if: needs.build.outputs.branch != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.branch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: village-tiles
          path: ${{ runner.temp }}/built
      - name: Commit changed tiles
        env:
          BRANCH: ${{ needs.build.outputs.branch }}
        run: |
          test -d "$RUNNER_TEMP/built/public/data/village/il" && test -f "$RUNNER_TEMP/built/src/data/village/tileList.json"
          rm -rf public/data/village
          cp -r "$RUNNER_TEMP/built/." .
          git add -A public/data/village src/data/village/tileList.json
          if git diff --cached --quiet; then echo "Village tiles are unchanged."; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Data: village footprints"
          git push origin "HEAD:refs/heads/$BRANCH"
