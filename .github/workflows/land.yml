name: Build Israel land cover

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: israel-land
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ESA WorldCover 10 m (2021, CC BY 4.0) read straight from its public bucket; ~20 minutes.
      - name: Build static land-cover cells
        run: npx tsx scripts/land/build.ts
      - name: Commit changed land data
        shell: bash
        run: |
          git add public/data/land/il
          if git diff --cached --quiet; then
            echo "Land data is unchanged."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Data: Israel land cover $(date -u +%F)"
          git push
