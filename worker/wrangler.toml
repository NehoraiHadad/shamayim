# Shamayim weather proxy (Cloudflare Workers, free plan). Open-Meteo's free tier needs no key; the live correction
# needs one secret, the IMS API token: `wrangler secret put IMS_TOKEN`.
# The account is chosen by `wrangler login`; no account_id is committed.
name = "shamayim-weather"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Custom domain on a zone in this Cloudflare account: the Cache API only works on a custom domain or route, not on
# *.workers.dev (there the Worker still coalesces and keeps a per-isolate memory cache).
routes = [{ pattern = "shamayim-api.nehoraihadad.com", custom_domain = true }]

[vars]
# Browser origins allowed to call the Worker (comma-separated); "https://*.host" allows one subdomain level
# (Pages preview builds). Add any new production origin of the app here.
ALLOWED_ORIGINS = "https://shamayim.nehoraihadad.com,https://sky.nehoraihadad.com,https://shamayim.pages.dev,https://*.shamayim.pages.dev,http://localhost:5173"

[observability]
enabled = true

# Live correction (src/live.ts): once an hour, 25 minutes past (IMS readings arrive ~20 min late), read the IMS
# station network and store each station's current forecast anomaly for `/v1/live`.
# Forecast log (src/forecastLog.ts): every 6 hours, keep the IMS and Open-Meteo forecasts for later verification.
# The second expression must match FORECAST_LOG_CRON in src/index.ts.
[triggers]
crons = ["25 * * * *", "40 */6 * * *"]

# Create once with `npx wrangler kv namespace create LIVE` and paste the id it prints.
[[kv_namespaces]]
binding = "LIVE"
id = "8e500d4c6ae147dca41d514f6649b293"
